#server.port=8093
# Nombre del servicio para identificacion dentro del ecosistema.
spring.application.name=anpa-shopping-service

spring.datasource.url=jdbc:mysql://localhost:3306/anpa_shopping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#spring.cloud.discovery.client.simple.instances.anpa-customer-service[0].uri=http://localhost:8091
#spring.cloud.discovery.client.simple.instances.anpa-product-service[0].uri=http://localhost:8092

# Discovery (Inicio)

# Puerto donde se levantara el servidor.
# El valor "0" permite que el sistema operativo asigne un puerto aleatorio.
server.port=0

# Configuracion para la instancia del cliente Eureka (Service Discovery).
# Se utiliza para registrar la aplicacion en el servidor Eureka.
# El "instance-id" se genera dinamicamente combinando el nombre de la aplicacion y un valor aleatorio.
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Discovery (Fin)